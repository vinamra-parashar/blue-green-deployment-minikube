# ─────────────────────────────────────────────────────────────
# Blue-Green Deployment - Docker Compose
# Services:
#   backend       → port 5000  (Node.js API + MongoDB Atlas)
#   frontend-blue → port 3100  (Blue deployment)
#   frontend-green→ port 3200  (Green deployment)
# ─────────────────────────────────────────────────────────────

services:

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bg-backend
    image: bg-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - bg-network

  # ── Frontend Blue ────────────────────────────────────────────
  frontend-blue:
    build:
      context: ./frontend-blue
      dockerfile: Dockerfile
    container_name: bg-frontend-blue
    image: bg-frontend-blue:latest
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - bg-network

  # ── Frontend Green ───────────────────────────────────────────
  frontend-green:
    build:
      context: ./frontend-green
      dockerfile: Dockerfile
    container_name: bg-frontend-green
    image: bg-frontend-green:latest
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - bg-network

# ── Shared Network ───────────────────────────────────────────
networks:
  bg-network:
    driver: bridge
    name: blue-green-network
