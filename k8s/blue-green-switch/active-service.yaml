# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION / ACTIVE Service  — Blue-Green Traffic Switch Point
#
# This single service is the "production ingress" for users.
# It starts pointing at BLUE (frontend-blue on port 3100).
#
# To switch traffic to GREEN, run:
#   kubectl patch service frontend-active-service -n blue-green \
#     --type='json' \
#     -p='[{"op":"replace","path":"/spec/selector/app","value":"frontend-green"},
#          {"op":"replace","path":"/spec/ports/0/targetPort","value":3200}]'
#
# To switch back to BLUE:
#   kubectl patch service frontend-active-service -n blue-green \
#     --type='json' \
#     -p='[{"op":"replace","path":"/spec/selector/app","value":"frontend-blue"},
#          {"op":"replace","path":"/spec/ports/0/targetPort","value":3100}]'
#
# NodePort 30000 = Production URL  →  http://<minikube-ip>:30000
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-active-service
  namespace: blue-green
  labels:
    role: production
    project: blue-green-deployment
  annotations:
    # Track which slot is currently live — updated by switch scripts
    blue-green/active-slot: "blue"
    blue-green/last-switched: "initial"
spec:
  type: NodePort
  # ── Selector points to BLUE initially ────────────────────────────────────
  selector:
    app: frontend-blue    # Change to 'frontend-green' to switch to Green
  ports:
    - name: http
      protocol: TCP
      port: 80             # Cluster-internal port (call the service on :80)
      targetPort: 3100     # Blue container port — change to 3200 for Green
      nodePort: 30000      # External NodePort — your PRODUCTION URL
