# ─────────────────────────────────────────────────────────────────
# secret.example.yaml — TEMPLATE ONLY, safe to commit
#
# To create the real secret, copy this file and fill in your values:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # Edit k8s/secret.yaml with your real credentials
#   kubectl apply -f k8s/secret.yaml
#
# Or use kubectl directly (without a file):
#   kubectl create secret generic backend-secret \
#     --from-literal=MONGO_URI="mongodb+srv://user:pass@host/db" \
#     --from-literal=PORT="5000" \
#     -n blue-green
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: blue-green
  labels:
    app: backend
    project: blue-green-deployment
type: Opaque
stringData:
  MONGO_URI: "<YOUR_MONGO_URI_HERE>"   # e.g. mongodb+srv://user:pass@cluster.mongodb.net/db
  PORT: "5000"
