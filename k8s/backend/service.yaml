apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: blue-green
  labels:
    app: backend
    project: blue-green-deployment
spec:
  # ClusterIP: internal-only — frontends reach backend via DNS
  # DNS: backend-service.blue-green.svc.cluster.local:5000
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 5000          # Service port (what clients connect to)
      targetPort: 5000    # Container port
