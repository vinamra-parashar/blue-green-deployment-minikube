# ─────────────────────────────────────────────────────────────────────────────
# PATCH: Switch production traffic from GREEN → BLUE (rollback)
#
# Apply with:  kubectl apply -f k8s/blue-green-switch/patch-to-blue.yaml
# Or use the switch script: ./scripts/bg-switch.sh blue
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-active-service
  namespace: blue-green
  labels:
    role: production
    project: blue-green-deployment
  annotations:
    blue-green/active-slot: "blue"
    blue-green/last-switched: "to-blue"
spec:
  type: NodePort
  selector:
    app: frontend-blue        # ← SWITCHED back to Blue
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3100        # ← Blue container port
      nodePort: 30000
